<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="./quiz.css">

  <title>Quiz Bíblico</title>
  
</head>
<body>

  <h1>Quiz Bíblico</h1>

  <div id="start-screen">
    <h2>Bem-vindo ao Quiz!</h2>
    
    <input type="text" id="usuario" placeholder="Digite seu nome" />
    <br>
    <button id="start-btn">Iniciar</button>
  </div>

  <div id="quiz-container" class="hidden">
    <div id="phase-info"></div>
    <div id="question"></div>
    <div id="answers"></div>
    <button id="next-btn" class="hidden">Próxima Pergunta</button>
    <button id="next-phase-btn" class="hidden">Avançar para a Próxima Fase</button>
    <div id="result" class="hidden"></div>
  </div>

  <div class="progresso">
    <button class="action" onclick="salvarProgresso()">💾 Salvar Progresso</button>
    <button class="action" onclick="consultarProgresso()">📊 Ver Progresso</button>
  </div>
  <div id="progresso-info" style="margin-top: 20px; font-size: 18px;"></div>


  
  <script src="./quiz.js"></script>

 <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js')
        .then((registration) => {
          console.log('Service Worker registrado com sucesso: ', registration);
        })
        .catch((error) => {
          console.log('Erro ao registrar o Service Worker: ', error);
        });
    });
  }
</script>

<script>
  // PREVENIR PULL-TO-REFRESH NO CELULAR - SOLUÇÃO DEFINITIVA
(function() {
    let startY = 0;
    let currentY = 0;
    
    function preventPullToRefresh(e) {
        // Pega o elemento que está sendo rolado
        const scrollable = e.target.closest('.quiz-container, body, #answers, .container') || document.body;
        
        // Verifica se o elemento pode rolar
        const isScrollable = scrollable.scrollHeight > scrollable.clientHeight;
        
        if (!isScrollable) {
            e.preventDefault();
            return;
        }
        
        // Obtém a posição do scroll atual
        const scrollTop = scrollable.scrollTop;
        
        // Se estiver no TOPO e tentar puxar para BAIXO
        if (scrollTop === 0 && currentY - startY > 0) {
            e.preventDefault();
            return;
        }
        
        // Se estiver no FINAL e tentar puxar para CIMA (rolar além do fim)
        if (scrollTop + scrollable.clientHeight >= scrollable.scrollHeight - 1 && currentY - startY < 0) {
            e.preventDefault();
            return;
        }
    }
    
    document.addEventListener('touchstart', function(e) {
        startY = e.touches[0].clientY;
    }, { passive: false });
    
    document.addEventListener('touchmove', function(e) {
        currentY = e.touches[0].clientY;
        preventPullToRefresh(e);
    }, { passive: false });
})();
</script>


</body>
</html>
